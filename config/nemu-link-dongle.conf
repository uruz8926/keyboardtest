# Lets &nl_mode and the hold-chord work on the dongle (BLE return request)
CONFIG_ZMK_NEMU_LINK_MODE_CONTROL=y
CONFIG_ZMK_NEMU_LINK_MODE_CHORD=y

# Trackball arrives over 2.4GHz and is turned into mouse HID here
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_INPUT_SPLIT=y

CONFIG_ZMK_KEYBOARD_NAME="torabo-tsuki"
